name: live-source-probe
on:
  push:
    branches: ['arena/10602981-nemo-live-kora']
    paths: ['.github/workflows/live-source-probe.yml', '.github/probe/*.sh', '.github/probe/*.ts']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund > /dev/null 2>&1
      - name: probes
        run: bash .github/probe/raw.sh > /tmp/raw.txt 2>&1 || true
      - run: bash .github/probe/emit.sh /tmp/raw.txt 0
      - run: bash .github/probe/emit.sh /tmp/raw.txt 10
      - run: bash .github/probe/emit.sh /tmp/raw.txt 20
      - run: bash .github/probe/emit.sh /tmp/raw.txt 30
      - run: bash .github/probe/emit.sh /tmp/raw.txt 40

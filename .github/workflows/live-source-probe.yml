name: live-source-probe
on:
  push:
    branches: ['arena/10602981-nemo-live-kora']
    paths: ['.github/workflows/live-source-probe.yml', '.github/probe/*.sh', '.github/probe/*.ts', '.github/probe/*.mjs']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund > /dev/null 2>&1
      - name: probes
        run: bash .github/probe/raw.sh > /tmp/raw.txt 2>&1 || true
      - if: always()
        run: |
          for n in m-home d-matches-tab m-detail; do echo "@@IMG $n"; base64 -w0 /tmp/$n.jpg 2>/dev/null || true; echo; done > /tmp/img.txt
          wc -c /tmp/raw.txt /tmp/img.txt || true
      - if: always()
        run: bash .github/probe/emit.sh /tmp/raw.txt 0
      - if: always()
        run: bash .github/probe/emit.sh /tmp/img.txt 0
      - if: always()
        run: bash .github/probe/emit.sh /tmp/img.txt 10
      - if: always()
        run: bash .github/probe/emit.sh /tmp/img.txt 20
      - if: always()
        run: bash .github/probe/emit.sh /tmp/img.txt 30

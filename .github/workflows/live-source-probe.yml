name: live-source-probe
on:
  push:
    branches: ['arena/10602981-nemo-live-kora']
    paths: ['.github/workflows/live-source-probe.yml', '.github/probe/*.sh', '.github/probe/*.ts']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: raw probes
        run: |
          mkdir -p .github/probe/out
          bash .github/probe/raw.sh > .github/probe/out/raw.txt 2>&1 || true
      - name: commit results
        run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git add .github/probe/out
          git commit -m "probe: results [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
